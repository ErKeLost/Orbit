[package]
name = "orbit"
version = "0.6.34"
default-run = "orbit"
description = "A local desktop workspace for Orbit"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# The real floor, not an aspiration: `Option::is_none_or` (stable 1.82) is used
# in this crate. Clippy's `incompatible_msrv` catches the gap, which is how this
# was found.
rust-version = "1.82.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
ax-control = []
ax-dump = []

[[bin]]
name = "ax_control"
path = "src/bin/ax_control.rs"
required-features = ["ax-control"]

[[bin]]
name = "ax_dump"
path = "src/bin/ax_dump.rs"
required-features = ["ax-dump"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
portable-pty = { version = "0.9", path = "../vendor/portable-pty" }
computer-use-core = { path = "../crates/computer-use-core" }
base64 = "=0.22.1"
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
log = "=0.4.34"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tauri = { version = "=2.11.5", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-log = "=2.9.1"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "2"
# Durable key/value state. The WebView's localStorage lives in the renderer's
# own storage, which the system can clear (and does under storage pressure);
# pairing credentials and the mobile-access intent must survive that.
# 2.5.0 requires tauri ^2.12; this is the newest that accepts the pinned 2.11.5.
tauri-plugin-store = "=2.4.5"
tauri-plugin-clipboard-manager = "=2.3.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
# GitLab inbox: small blocking HTTP client for the REST API (same choice as the
# MonoCode inbox this module was ported from). `tls` covers the ring rustls
# stack already in the tree; `gzip` matches GitLab's compressed responses.
# `native-certs` is required: with `tls` alone ureq verifies against the bundled
# Mozilla root set (webpki-roots), so any self-hosted GitLab behind an internal
# CA (e.g. gitlab.howone.dev) fails with an opaque "Could not reach GitLab"
# (UnknownIssuer). It makes rustls read the OS trust store instead, matching
# curl/SecureTransport and reqwest's rustls-platform-verifier.
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "native-certs", "gzip"] }
# Preview encoder for the screen channel (docs/SCREEN.md). JPEG keeps the P0
# path free of native dependencies and fast enough at preview resolution; the
# encoder sits behind screen::encode::Encoder so the VideoToolbox H.264
# implementation can replace it without touching the protocol.
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
# `sync` is needed on every platform: the screen bus wakes each subscribed
# connection with a channel instead of letting it poll. `rt`/`net`/`io-util` are
# for the connection loops, which only exist on desktop.
tokio = { version = "=1.53.1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
uuid = { version = "=1.26.0", features = ["v4"] }
# Process control for the terminal PTY (kill/setsid/ioctl) on every unix target;
# the macOS accessibility stack reuses the same pin below.
libc = "=0.2.189"

# The desktop Host uses a small blocking WebSocket server so mobile clients
# can connect over a trusted LAN. These are desktop-only; mobile builds use
# the shared TypeScript client and do not bundle a server.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
aes-gcm = "=0.10.3"
openssl = { version = "=0.10.73", features = ["vendored"] }
openssl-probe = "=0.1.6"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
# Desktop integration: one Orbit at a time, remembered window geometry, system
# notifications, launch at login, and a global show/hide hotkey. Pinned to the
# newest releases that still accept the tauri version pinned above.
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-window-state = "=2.4.1"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-global-shortcut = "=2.3.2"
tungstenite = { version = "=0.26.2", default-features = false, features = ["handshake", "native-tls"] }
# The connection loops are async so a socket can be read and written at the same
# time. The blocking version had to poll `read` on a timer to notice outbound
# work, which put a floor under the latency of everything the phone receives.
# `tokio-tungstenite` 0.26.2 depends on the same `tungstenite` pinned above, so
# this does not pull a second copy of the protocol implementation.
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["handshake", "connect"] }
# `Sink`/`Stream` for the async WebSocket: the loop reads and writes the same
# socket, which is the whole point of the async rewrite.
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# The relay's TLS stays OpenSSL on purpose (see `relay_connect`); this is its
# async transport, so the handshake fingerprint does not change.
tokio-openssl = "=0.6.5"
# Native macOS accessibility backend for the desktop AX collector (worker,
# input synthesis, AppKit activation). Other desktop platforms ship without
# the engine in this release.
[target.'cfg(target_os = "macos")'.dependencies]
xa11y = "=0.15.0"
objc2-app-kit = { version = "=0.3.2", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", features = ["NSURL", "NSString", "NSArray"] }
block2 = "=0.6.2"
# Screen channel (docs/SCREEN.md): ScreenCaptureKit capture, CoreMedia/CoreVideo
# pixel buffers, and macOS screen-recording permission probes. VideoToolbox
# encoding for the H.264 phase is added together with the WebRTC transport.
objc2 = "=0.6.4"
objc2-core-foundation = { version = "=0.3.2", features = ["CFArray", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", features = ["CGDirectDisplay", "CGWindow", "CGEvent"] }
objc2-core-media = { version = "=0.3.2", features = ["CMTime", "CMSampleBuffer", "objc2-core-video"] }
# The pixel path runs on `apple-cf` (see below) so the iOSurface/pixel-buffer
# wrappers are shared with the encoder instead of hand-written twice.
objc2-screen-capture-kit = { version = "=0.3.2", features = ["SCShareableContent", "SCStream", "SCError", "block2", "dispatch2"] }
# Hardware H.264 for the screen channel. VideoToolbox reads the IOSurface the
# capturer already produced, so the encoder path never touches the CPU.
# Hardware H.264 through a maintained wrapper rather than a hand-written
# session + output callback + NAL extraction. It consumes the same IOSurface the
# capturer produced, so the zero-copy path is preserved, and its
# `apple-cf` types are `Send + Sync`, which removes a hand-written
# `unsafe impl Send` along with the rest.
videotoolbox = "=0.21.0"
apple-cf = { version = "=0.11.0", features = ["cg", "cm", "cv", "iosurface"] }
dispatch2 = "=0.3.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.6"

[target.'cfg(windows)'.dependencies]
# ConPTY child management for the terminal: children join a job object so a
# crashed host never leaves orphaned shells, and console windows stay hidden.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp"] }
