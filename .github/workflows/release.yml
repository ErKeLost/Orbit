name: Release Orbit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            args: --target x86_64-apple-darwin
          - name: Linux x86_64
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Resolve Bun executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: "\"ORBIT_BUN_PATH=$((Get-Command bun).Source)\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Resolve Bun executable
        if: runner.os != 'Windows'
        run: echo "ORBIT_BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'

      - name: Install Intel macOS target
        if: matrix.name == 'macOS Intel'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.name == 'Linux x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Restore macOS signing certificate
        if: runner.os == 'macOS'
        env:
          ORBIT_MACOS_SIGNING_P12_BASE64: ${{ secrets.ORBIT_MACOS_SIGNING_P12_BASE64 }}
          ORBIT_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.ORBIT_MACOS_SIGNING_P12_PASSWORD }}
        run: |
          test -n "$ORBIT_MACOS_SIGNING_P12_BASE64" || { echo "::error::Missing ORBIT_MACOS_SIGNING_P12_BASE64. macOS builds need the self-signed code signing certificate (run scripts/make-signing-cert.sh locally, then upload work/orbit-signing.p12.base64 and work/orbit-signing.password as repository secrets). Ad-hoc builds would break Accessibility grants on every update."; exit 1; }
          test -n "$ORBIT_MACOS_SIGNING_P12_PASSWORD" || { echo "::error::Missing ORBIT_MACOS_SIGNING_P12_PASSWORD."; exit 1; }
          printf '%s' "$ORBIT_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/orbit-signing.p12"
          # tauri-macos-sign's APPLE_CERTIFICATE path only resolves Apple-prefixed
          # identities, so import the self-signed P12 ourselves and let the
          # bundler find it via APPLE_SIGNING_IDENTITY (codesign -s <name>).
          keychain="$RUNNER_TEMP/orbit-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" $(security list-keychain -d user | tr -d '"')
          security import "$RUNNER_TEMP/orbit-signing.p12" -k "$keychain" -P "$ORBIT_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security find-identity -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=Orbit Developer" >> "$GITHUB_ENV"

      - name: Smoke test code signing
        if: runner.os == 'macOS'
        run: |
          set -x
          echo 'int main(){return 0;}' > "$RUNNER_TEMP/smoke.c"
          cc -o "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke.c"
          perl -e 'alarm 60; exec @ARGV' codesign --force -s "Orbit Developer" "$RUNNER_TEMP/smoke"
          codesign --verify --strict "$RUNNER_TEMP/smoke"
          codesign -dvv "$RUNNER_TEMP/smoke" 2>&1 | grep -E "Authority=|CDHash="
          rm -f "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke.c"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: Orbit v__VERSION__
          releaseBody: "Orbit installers for macOS, Linux, and Windows. macOS builds are signed with a self-signed certificate (no Apple notarization) - right-click the app on first install to approve it, and in-app updates keep Accessibility grants."
          # Keep the release out of /releases/latest until every desktop
          # matrix job has uploaded its updater metadata.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  android:
    name: Android ARM64
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Bun executable
        run: echo "ORBIT_BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        run: |
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$android_home"
          export ANDROID_SDK_ROOT="$android_home"
          export PATH="$android_home/cmdline-tools/latest/bin:$android_home/cmdline-tools/16.0/bin:$android_home/platform-tools:$PATH"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android signing key
        env:
          ORBIT_ANDROID_KEYSTORE_BASE64: ${{ secrets.ORBIT_ANDROID_KEYSTORE_BASE64 }}
          ORBIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_ANDROID_KEYSTORE_PASSWORD }}
          ORBIT_ANDROID_KEY_ALIAS: ${{ secrets.ORBIT_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ORBIT_ANDROID_KEYSTORE_BASE64" || { echo "Missing ORBIT_ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ORBIT_ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ORBIT_ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$ORBIT_ANDROID_KEY_ALIAS" || { echo "Missing ORBIT_ANDROID_KEY_ALIAS" >&2; exit 1; }
          key_path="$RUNNER_TEMP/orbit-android-release.jks"
          printf '%s' "$ORBIT_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$ORBIT_ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ORBIT_ANDROID_KEY_ALIAS
          storeFile=$key_path
          EOF

      - name: Build signed Android APK
        run: bun run tauri android build --target aarch64 --apk

      - name: Stage Android APK
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "orbit-android-arm64-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: orbit-android-arm64-${{ github.ref_name }}
          path: orbit-android-arm64-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="orbit-android-arm64-${tag}.apk"
          for attempt in $(seq 1 120); do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release view "$tag" >/dev/null 2>&1 || { echo "Draft release $tag was not created" >&2; exit 1; }
          gh release upload "$tag" "$asset" --clobber

  publish:
    name: Publish release
    needs: [release, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease=false
