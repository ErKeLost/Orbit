name: Release Orbit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            args: --target aarch64-apple-darwin
          # 暂时停发 Intel 包：需要时取消注释即可恢复。
          # - name: macOS Intel
          #   os: macos-15-intel
          #   args: --target x86_64-apple-darwin
          - name: Linux x86_64
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Resolve Bun executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: "\"ORBIT_BUN_PATH=$((Get-Command bun).Source)\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Resolve Bun executable
        if: runner.os != 'Windows'
        run: echo "ORBIT_BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'

      # 暂时停发 Intel 包，随 matrix 一起注释。
      # - name: Install Intel macOS target
      #   if: matrix.name == 'macOS Intel'
      #   run: rustup target add x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.name == 'Linux x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.name }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: Orbit v__VERSION__
          releaseBody: "Orbit installers for macOS, Linux, and Windows. macOS builds use fast ad-hoc signing and are not notarized; right-click the app on first install to approve it. Updating may require allowing Accessibility again."
          # Keep the release out of /releases/latest until every desktop
          # matrix job has uploaded its updater metadata.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Verify packaged macOS worker signature and startup
        if: matrix.name == 'macOS Apple Silicon'
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Orbit.app"
          worker="$app/Contents/Resources/resources/computer-use/ax_control"
          test -x "$worker"
          codesign --verify --strict --verbose=2 "$worker"
          codesign --verify --deep --strict --verbose=2 "$app"
          response="$(printf '{"id":1,"command":"signature-check","app":"Orbit"}\n' | "$worker")"
          echo "$response" | jq -e '.id == 1 and .ok == false and .error.code == "AX_ERROR"'

  android:
    name: Android ARM64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve Bun executable
        run: echo "ORBIT_BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        run: |
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$android_home"
          export ANDROID_SDK_ROOT="$android_home"
          export PATH="$android_home/cmdline-tools/latest/bin:$android_home/cmdline-tools/16.0/bin:$android_home/platform-tools:$PATH"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-android-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android signing key
        env:
          ORBIT_ANDROID_KEYSTORE_BASE64: ${{ secrets.ORBIT_ANDROID_KEYSTORE_BASE64 }}
          ORBIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_ANDROID_KEYSTORE_PASSWORD }}
          ORBIT_ANDROID_KEY_ALIAS: ${{ secrets.ORBIT_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ORBIT_ANDROID_KEYSTORE_BASE64" || { echo "Missing ORBIT_ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ORBIT_ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ORBIT_ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$ORBIT_ANDROID_KEY_ALIAS" || { echo "Missing ORBIT_ANDROID_KEY_ALIAS" >&2; exit 1; }
          key_path="$RUNNER_TEMP/orbit-android-release.jks"
          printf '%s' "$ORBIT_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$ORBIT_ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ORBIT_ANDROID_KEY_ALIAS
          storeFile=$key_path
          EOF

      - name: Build signed Android APK
        run: bun run tauri android build --target aarch64 --apk

      - name: Stage Android APK
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "orbit-android-arm64-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: orbit-android-arm64-${{ github.ref_name }}
          path: orbit-android-arm64-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="orbit-android-arm64-${tag}.apk"
          for attempt in $(seq 1 120); do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release view "$tag" >/dev/null 2>&1 || { echo "Draft release $tag was not created" >&2; exit 1; }
          gh release upload "$tag" "$asset" --clobber

  publish:
    name: Publish release
    needs: [release, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease=false
