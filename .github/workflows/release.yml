name: Release Orbit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    # Pinned rather than `ubuntu-latest`: the floating label is scheduled to
    # move to Ubuntu 26, and a release job should not discover that by failing.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Create one draft before platform jobs start
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft-state" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-draft-state")" = true || { echo "Release is already published" >&2; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Orbit $GITHUB_REF_NAME" --generate-notes \
              --notes "Orbit installers for macOS, Linux, and Windows. macOS builds use fast ad-hoc signing and are not notarized; right-click the app on first install to approve it. Updating may require allowing Accessibility again."
          fi

  release:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          # 暂时停发 Intel 包：需要时取消注释即可恢复。
          # - name: macOS Intel
          #   os: macos-15-intel
          #   args: --target x86_64-apple-darwin
          - name: Linux x86_64
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Resolve Bun executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: "\"ORBIT_BUN_PATH=$((Get-Command bun).Source)\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Resolve Bun executable
        if: runner.os != 'Windows'
        run: echo "ORBIT_BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"

      # One step for every platform: Windows builds for the host (MSVC), macOS
      # cross-builds to arm64, Linux for the host. `targets` is empty for the
      # host-only jobs, which `rustup` accepts.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # 暂时停发 Intel 包，随 matrix 一起注释。
      # - name: Install Intel macOS target
      #   if: matrix.name == 'macOS Intel'
      #   run: rustup target add x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.name == 'Linux x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Rust dependency cache.
      #
      # This used to be `actions/cache` over the whole `src-tauri/target`, with
      # one entry per platform *per Cargo.lock revision*. Four platforms times
      # every dependency change pushed the repository past GitHub's 10 GB cache
      # limit, so entries were evicted faster than they were written and each
      # release paid for a cold build of the entire Tauri tree. Windows, the
      # slowest platform, sat at ~24 minutes because of it.
      #
      # `rust-cache` keeps one entry per platform, stores dependency artifacts
      # only (so editing our own sources does not invalidate it), and prunes the
      # entries it replaces — which is what keeps the total inside the limit.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
          # A failed build still warms the dependency cache for the retry.
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: Orbit v__VERSION__
          releaseBody: "Orbit installers for macOS, Linux, and Windows. macOS builds use fast ad-hoc signing and are not notarized; right-click the app on first install to approve it. Updating may require allowing Accessibility again."
          # Keep the release out of /releases/latest until every desktop
          # matrix job has uploaded its updater metadata.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Verify packaged macOS worker signature and startup
        if: matrix.name == 'macOS Apple Silicon'
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Orbit.app"
          worker="$app/Contents/Resources/resources/computer-use/ax_control"
          test -x "$worker"
          codesign --verify --strict --verbose=2 "$worker"
          codesign --verify --deep --strict --verbose=2 "$app"
          response="$(printf '{"id":1,"command":"signature-check","app":"Orbit"}\n' | "$worker")"
          echo "$response" | jq -e '.id == 1 and .ok == false and .error.code == "AX_ERROR"'

  android:
    name: Android ARM64
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve Bun executable
        run: echo "ORBIT_BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        run: |
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$android_home"
          export ANDROID_SDK_ROOT="$android_home"
          export PATH="$android_home/cmdline-tools/latest/bin:$android_home/cmdline-tools/16.0/bin:$android_home/platform-tools:$PATH"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # The NDK is a ~1 GB download that `sdkmanager` repeats on every release
      # for no reason: the version is pinned, so it either matches the cache or
      # the cache is useless.
      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/29.0.13846066
          key: android-ndk-29.0.13846066-${{ runner.os }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android signing key
        env:
          ORBIT_ANDROID_KEYSTORE_BASE64: ${{ secrets.ORBIT_ANDROID_KEYSTORE_BASE64 }}
          ORBIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_ANDROID_KEYSTORE_PASSWORD }}
          ORBIT_ANDROID_KEY_ALIAS: ${{ secrets.ORBIT_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ORBIT_ANDROID_KEYSTORE_BASE64" || { echo "Missing ORBIT_ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ORBIT_ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ORBIT_ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$ORBIT_ANDROID_KEY_ALIAS" || { echo "Missing ORBIT_ANDROID_KEY_ALIAS" >&2; exit 1; }
          key_path="$RUNNER_TEMP/orbit-android-release.jks"
          printf '%s' "$ORBIT_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$ORBIT_ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ORBIT_ANDROID_KEY_ALIAS
          storeFile=$key_path
          EOF

      - name: Build signed Android APK
        run: bun run tauri android build --target aarch64 --apk

      - name: Stage Android APK
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "orbit-android-arm64-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: orbit-android-arm64-${{ github.ref_name }}
          path: orbit-android-arm64-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="orbit-android-arm64-${tag}.apk"
          # `prepare` runs before this job, so the draft exists already; the
          # retry is only for GitHub's eventual consistency on the API.
          for attempt in $(seq 1 30); do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release view "$tag" >/dev/null 2>&1 || { echo "Draft release $tag was not created" >&2; exit 1; }
          gh release upload "$tag" "$asset" --clobber

  publish:
    name: Publish release
    needs: [release, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify all platform assets and updater entries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-release-check"
          release_id="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/orbit-release-check/release.json"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP/orbit-release-check"
          python3 - "$RUNNER_TEMP/orbit-release-check/release.json" "$RUNNER_TEMP/orbit-release-check/latest.json" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1]))
          update = json.load(open(sys.argv[2]))
          version = release['tag_name'].removeprefix('v')
          if update['version'] != version:
              raise SystemExit('Updater version does not match release tag')
          names = {asset['name'] for asset in release['assets']}
          required_assets = {
              f'Orbit_{version}_aarch64.app.tar.gz', f'Orbit_{version}_aarch64.app.tar.gz.sig', f'Orbit_{version}_aarch64.dmg',
              f'Orbit_{version}_x64-setup.exe', f'Orbit_{version}_x64-setup.exe.sig',
              f'Orbit_{version}_x64_en-US.msi', f'Orbit_{version}_x64_en-US.msi.sig',
              f'Orbit_{version}_amd64.AppImage', f'Orbit_{version}_amd64.AppImage.sig',
              f'Orbit_{version}_amd64.deb', f'Orbit_{version}_amd64.deb.sig',
              f'Orbit-{version}-1.x86_64.rpm', f'Orbit-{version}-1.x86_64.rpm.sig',
              f'orbit-android-arm64-v{version}.apk', 'latest.json',
          }
          missing = required_assets - names
          if missing:
              raise SystemExit(f'Missing release assets: {sorted(missing)}')
          ids = {str(asset['id']) for asset in release['assets']}
          required_platforms = {
              'darwin-aarch64', 'darwin-aarch64-app',
              'windows-x86_64', 'windows-x86_64-nsis', 'windows-x86_64-msi',
              'linux-x86_64', 'linux-x86_64-appimage', 'linux-x86_64-deb', 'linux-x86_64-rpm',
          }
          missing = required_platforms - update['platforms'].keys()
          if missing:
              raise SystemExit(f'Missing updater platforms: {sorted(missing)}')
          for platform in required_platforms:
              asset_id = update['platforms'][platform]['url'].rsplit('/', 1)[-1]
              if asset_id not in ids:
                  raise SystemExit(f'{platform} points outside this release: {asset_id}')
          print('All release assets and updater entries verified')
          PY

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease=false
