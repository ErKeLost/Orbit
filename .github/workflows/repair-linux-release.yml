name: Repair Linux release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to rebuild from
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: repair-linux-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Verify release source and destination
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          node -e 'const p=require("./package.json");if("v"+p.version!==process.env.RELEASE_TAG)process.exit(1)'
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Free disk space
        # Same reason as the release workflow: deb + rpm + target do not fit on a
        # hosted image that still carries the Android SDK, .NET and GHC.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-4-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev libasound2-dev libnss3-dev libxss-dev patchelf xdg-utils rpm
          python -m pip install cmake==4.4.4 ninja==1.13.2
          echo "ORBIT_BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: Linux x86_64
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Verify AppImage deployment source
        env:
          ANYLINUX_LIB_SOURCE: https://raw.githubusercontent.com/FabianLars/Anylinux-AppImages/3e280d1b2270fecfcb2c2c823b490c782ecf1277/useful-tools/lib/anylinux.c
        run: curl --fail --location --retry 4 "$ANYLINUX_LIB_SOURCE" --output "$RUNNER_TEMP/anylinux.c"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANYLINUX_LIB_SOURCE: https://raw.githubusercontent.com/FabianLars/Anylinux-AppImages/3e280d1b2270fecfcb2c2c823b490c782ecf1277/useful-tools/lib/anylinux.c
        with:
          tauriScript: bun run tauri
          tagName: ${{ inputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: "--bundles deb,rpm"

      # The release workflow's Linux job installs this package and requires it
      # to stay alive; a repair that skipped that would upload an unverified
      # binary and look green. The script is taken from `main` because the tag
      # being repaired predates its fix (that is why the repair exists).
      - name: Fetch shared verification script
        run: |
          git fetch --depth 1 origin main
          git checkout FETCH_HEAD -- scripts/verify-linux-package.sh
          bash -n scripts/verify-linux-package.sh

      - name: Verify packaged Linux build starts
        run: |
          sudo apt-get install -y xvfb dbus-x11 xauth
          bash scripts/verify-linux-package.sh
