<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit — a personal agent that runs on your own machine</title>
    <meta
      name="description"
      content="Orbit is a desktop workspace for Pi: streaming chat, parallel sub-agents, a browser column the agent can drive and your own models — local-first, for macOS, Linux and Windows."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050417" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://orbit-agent.netlify.app/" />
    <link rel="canonical" href="https://orbit-agent.netlify.app/" />
    <meta property="og:site_name" content="Orbit" />
    <meta property="og:title" content="Orbit — your agent, on your machine" />
    <meta
      property="og:description"
      content="Parallel sub-agents, a browser column the agent can drive, a real terminal, and your own models. v1.0."
    />
    <!-- Absolute URLs for social cards are set when the domain is; keep this relative-safe meanwhile. -->
    <meta property="og:image" content="https://orbit-agent.netlify.app/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orbit — your agent, on your machine" />
    <meta name="twitter:description" content="A desktop workspace for Pi. Local-first, sub-agents, a real browser column." />
    <meta name="twitter:image" content="https://orbit-agent.netlify.app/social-card.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Paint the night sky before the bundle arrives, so the first frame is the
         page's colour rather than the browser's white. -->
    <style>
      html {
        background: #050417;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 18vh auto; padding: 0 24px; color: #f5f2ff; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1 style="letter-spacing: -0.02em">Orbit</h1>
        <p>A desktop workspace for Pi. This page needs JavaScript to show the tour; the download does not.</p>
        <p><a style="color: #b98bff" href="https://github.com/ErKeLost/Orbit/releases/latest">Download the latest release</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
